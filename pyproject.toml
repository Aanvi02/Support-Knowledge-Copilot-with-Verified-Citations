    { name = "Aanvi02", email = "aanvirohilla26@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "python-dotenv>=1.2.4",
